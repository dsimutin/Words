<style>
:root{--navy:#111d33;--green:#2f8b66;--paper:#fffefd;--mist:#eef5f2;--red:#c94d4d;--amber:#bd8424}*{box-sizing:border-box}body{margin:0;background:#0e1823;color:var(--navy);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}.shell{width:min(690px,100%);margin:auto;padding:max(18px,env(safe-area-inset-top)) 14px max(30px,env(safe-area-inset-bottom))}.brand{color:#dce9e4;letter-spacing:.22em;font:700 12px Georgia,serif;margin:4px 5px 18px}.panel,.card{background:var(--paper);border-radius:32px;box-shadow:0 16px 45px #0005}.panel{padding:26px}.welcome h1{font:700 44px Georgia,serif;margin:5px 0 10px}.muted{color:#728091}.menu{display:grid;gap:12px;margin-top:22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0}.stat{background:var(--mist);border-radius:16px;padding:13px 8px;text-align:center}.stat b{display:block;font:700 25px Georgia,serif;color:var(--green)}.stat small{color:#718078}.btn{border:0;border-radius:17px;padding:16px 19px;font-weight:750;cursor:pointer}.primary{background:var(--green);color:white}.secondary{background:#eaf3ef;color:var(--green)}.danger{background:#fdecec;color:var(--red)}.ghost{background:#f2f4f4;color:#61706a}.card{min-height:70vh;padding:36px;display:flex;flex-direction:column;position:relative}.topline{display:flex;align-items:center;gap:8px}.eyebrow{color:var(--green);font:700 11px Georgia,serif;letter-spacing:.23em}.badge{font-size:12px;background:#eaf3ef;color:var(--green);padding:6px 10px;border-radius:99px}.counter{position:absolute;right:32px;top:27px;background:#eaf3ef;color:var(--green);padding:7px 11px;border-radius:12px;font-weight:700}.wordline{display:flex;align-items:center;gap:12px;margin:46px 0 13px}.word{font:700 clamp(49px,12vw,82px) Georgia,serif;line-height:1}.speak{border:0;background:#eaf3ef;color:var(--green);width:48px;height:48px;border-radius:50%;font-size:22px}.rule{width:88px;height:5px;background:var(--green);border-radius:4px}.phonetic{font:28px Georgia,serif;color:var(--green);margin:16px 0}.forms{font:26px Georgia,serif;margin:4px 0 18px}.assoc{width:100%;height:min(32vh,280px);object-fit:cover;border-radius:22px;background:var(--mist);margin:15px 0}.spacer{flex:1}.label{color:var(--green);font:700 11px Georgia,serif;letter-spacing:.22em}.translation{font:700 38px Georgia,serif;margin:11px 0 16px}.translation.covered{filter:blur(12px);user-select:none}.example{background:var(--mist);border-radius:19px;padding:17px 20px;font:21px Georgia,serif;color:#526174}.example mark{background:none;color:var(--green);font-weight:700}.cardtools{display:flex;gap:8px;margin:12px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:12px}.quiz-title{font:700 25px Georgia,serif}.quiz-prompt{font:700 clamp(38px,10vw,58px) Georgia,serif;margin:32px 0}.choice{width:100%;margin:6px 0;text-align:left;background:#edf4f1;color:var(--navy)}.feedback{text-align:center;margin:22px 0}.feedback h2{font:700 34px Georgia,serif}.score{text-align:center;padding:40px 10px}.score strong{display:block;font:700 72px Georgia,serif;color:var(--green)}.loading{color:white;text-align:center;padding:35vh 10px}.admin{width:min(1050px,100%)}.admin .panel{margin-bottom:15px}.student{border-top:1px solid #dce5e1;padding:17px 0}.student:first-child{border:0}.student-head{display:flex;justify-content:space-between;gap:12px}.meta{font-size:14px;color:#718078;margin-top:5px}.student-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.mini{background:var(--mist);padding:10px;border-radius:12px;font-size:13px}.details{background:#f6f8f7;border-radius:14px;padding:12px;margin-top:10px}.details summary{cursor:pointer;font-weight:700}.history{font-size:13px;margin:7px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{width:100%;border:1px solid #ccd9d3;border-radius:13px;padding:13px;margin:6px 0}.error{background:#fff1f1;color:#a52e2e;border-radius:16px;padding:17px}.hidden{display:none!important}
@media(max-width:560px){.shell{padding-left:9px;padding-right:9px}.card{padding:28px 22px;border-radius:27px;min-height:79vh}.assoc{height:240px}.student-grid{grid-template-columns:1fr 1fr}.admin .row{grid-template-columns:1fr}.student-head{display:block}.counter{right:22px}.wordline{margin-top:42px}}
.choice.correct{background:#ccebd9!important;color:#155c3d!important;box-shadow:inset 0 0 0 2px #40a474}.choice.wrong{background:#f9d2d2!important;color:#9d2929!important;box-shadow:inset 0 0 0 2px #dc6767}.choice:disabled{opacity:1;cursor:default}.teacher-entry{display:block;margin:15px auto 0;background:transparent;border:0;color:#8fa19a;font-size:13px;padding:10px;cursor:pointer}select.field{background:white}.difficulty{font-size:12px;padding:6px 10px;border-radius:99px;font-weight:700}.difficulty.easy{background:#e5f5e9;color:#28734a}.difficulty.medium{background:#fff2cf;color:#936414}.difficulty.hard{background:#fde2e2;color:#a63838}html,body,button{touch-action:manipulation}button{-webkit-tap-highlight-color:transparent}
@media(max-width:560px){.shell:not(.admin){height:100dvh;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding-top:max(28px,env(safe-area-inset-top));padding-bottom:max(8px,env(safe-area-inset-bottom))}.shell:not(.admin)[data-view="home"],.shell:not(.admin)[data-view="quiz"],.shell:not(.admin)[data-view="retry"]{justify-content:center}.shell:not(.admin)>.brand{flex:0 0 auto;margin-bottom:9px}.shell:not(.admin)>.card{flex:0 0 auto;min-height:0;height:min(62dvh,620px);overflow-y:auto;padding-top:22px;padding-bottom:22px}.shell:not(.admin)>.cardtools,.shell:not(.admin)>.answers{flex:0 0 auto}.shell:not(.admin)>.cardtools{margin:7px 0}.shell:not(.admin)>.answers{margin-top:0}.shell:not(.admin)>.panel{overflow-y:auto}.wordline{margin-top:27px}.translation{font-size:33px}.example{font-size:18px;padding:13px 16px}}
</style></head><body><main id="app" class="shell"><div class="loading">Загружаю занятие…</div></main>
<script>
const params=new URLSearchParams(location.search),queryToken=params.get('token')||'',queryTeacher=params.get('teacher')||'';if(queryToken)localStorage.setItem('wordsToken',queryToken);if(queryTeacher)localStorage.setItem('wordsTeacher',queryTeacher);const TOKEN=queryToken||localStorage.getItem('wordsToken')||'';let TEACHER=queryTeacher||(!TOKEN?localStorage.getItem('wordsTeacher')||'':'');const API_URL='https://script.google.com/macros/s/AKfycbzXGwwZqhBFhVkdWnY84sz4YAc-iTSqShHS9PDfTaNq6uDQF-geMDTpUk4zptzNLnHarQ/exec',APP_URL=location.origin+location.pathname,app=document.getElementById('app');let lesson,index=0,ratings=[],quizIndex=0,quizScore=0,quizAnswers=[],retry=[],retryIndex=0,tableTabs={words:[],verbs:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function call(name,...args){return new Promise((ok,fail)=>{const callback='__words_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script'),cleanup=()=>{clearTimeout(timer);delete window[callback];script.remove()},timer=setTimeout(()=>{cleanup();fail(new Error('Сервер долго не отвечает. Проверьте интернет и повторите.'))},25000);window[callback]=response=>{cleanup();response&&response.ok?ok(response.data):fail(new Error(response&&response.error||'Неизвестная ошибка сервера'))};script.onerror=()=>{cleanup();fail(new Error('Ошибка подключения к серверу.'))};script.src=API_URL+'?api=1&action='+encodeURIComponent(name)+'&args='+encodeURIComponent(JSON.stringify(args))+'&callback='+encodeURIComponent(callback);document.head.appendChild(script)})}function fail(e){app.innerHTML=`<div class="panel error"><b>Не удалось открыть приложение</b><br><br>${esc(e.message)}<br><br><button class="btn secondary" onclick="location.reload()">Повторить</button></div>`}
async function init(){const cacheKey='wordsHome:'+TOKEN,cached=!TEACHER&&TOKEN?localStorage.getItem(cacheKey):'';let cachedData=null;if(cached)try{cachedData=JSON.parse(cached);renderHome(cachedData)}catch(e){localStorage.removeItem(cacheKey)}try{const d=await call('bootstrap',TOKEN,TEACHER);if(d.role==='teacher'){tableTabs=d.tabs||{words:[],verbs:[]};renderTeacher(d.dashboard);return}localStorage.setItem(cacheKey,JSON.stringify(d));if(!cachedData||app.dataset.view==='home')renderHome(d)}catch(e){if(!cachedData)fail(e)}}
function renderHome(d){app.dataset.view='home';app.className='shell';const spanish=d.student.language==='es';app.innerHTML=`<div class="brand">WORDS · ${spanish?'SPANISH':'ENGLISH'} TRAINER</div><section class="panel welcome"><div class="eyebrow">ДОБРО ПОЖАЛОВАТЬ</div><h1>${esc(d.student.name)}</h1><p class="muted">Семь карточек и проверка сразу после изучения.</p><div class="stats"><div class="stat"><b>${d.studied||0}</b><small>изучено</small></div><div class="stat"><b>${d.learned||0}</b><small>закреплено</small></div><div class="stat"><b>${d.due||0}</b><small>повторить</small></div></div><div class="menu"><button class="btn primary" onclick="startLesson('word')">📚 Учить слова · ${d.counts.words}</button>${d.counts.verbs?`<button class="btn secondary" onclick="startLesson('verb')">⚡ Учить глаголы · ${d.counts.verbs}</button>`:''}</div></section><button class="teacher-entry" onclick="teacherLogin()">Вход преподавателя</button>`}
async function startLesson(c){app.dataset.view='loading';app.innerHTML='<div class="loading">Подбираю семь карточек…</div>';try{lesson=await call('loadLesson',TOKEN,c);lesson.sessionId=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());index=0;ratings=[];if(!lesson.items.length){app.innerHTML='<div class="panel"><h2>Карточек пока нет</h2><button class="btn secondary" onclick="init()">Назад</button></div>';return}app.dataset.view='lesson';renderCard()}catch(e){fail(e)}}
function markedExample(x){const safe=esc(x.example);if(!x.word)return safe;const re=new RegExp('('+x.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return safe.replace(re,'<mark>$1</mark>')}
function renderCard(){const x=lesson.items[index],verb=x.category==='verb',difficulty=String(x.difficulty||'').toLowerCase(),difficultyLabel={easy:'Легко',medium:'Средне',hard:'Сложно'}[difficulty]||'',typeLabel=verb?(x.language==='es'?'VERBO':'IRREGULAR VERB'):'VOCABULARY';app.innerHTML=`<div class="brand">WORDS · ${verb?'VERBS':'VOCABULARY'}</div><article class="card"><div class="topline"><div class="eyebrow">${typeLabel}</div><span class="badge">${esc(x.state)}</span>${difficultyLabel?`<span class="difficulty ${difficulty}">${difficultyLabel}</span>`:'' }</div><div class="counter">${String(index+1).padStart(2,'0')}/${lesson.total}</div><div class="wordline"><div class="word">${esc(x.word)}</div><button class="speak" data-speak="${esc(x.word)}" onclick="speak(this.dataset.speak)" aria-label="Произнести слово">🔊</button></div><div class="rule"></div>${x.transcription?`<div class="phonetic">${esc(x.transcription)}</div>`:''}${verb&&(x.present||x.pastSimple||x.pastParticiple)?`<div class="forms">${[x.present,x.pastSimple,x.pastParticiple].filter(Boolean).map(esc).join(' &nbsp;·&nbsp; ')}</div>`:''}<div class="spacer"></div><div id="answerBlock" class="hidden"><div class="label">ПЕРЕВОД</div><div class="translation">${esc(x.translation)}</div></div>${x.example?`<div class="example">${markedExample(x)}</div>`:''}</article><div id="revealTools" class="cardtools"><button class="btn secondary" style="width:100%" onclick="revealAnswer()">👁 Показать перевод</button></div><div class="answers"><button class="btn danger" onclick="rate(false)">Не знаю</button><button class="btn primary" onclick="rate(true)">Знаю</button></div>`}
let activeUtterance=null;
function speak(t){
  const current=lesson&&lesson.items&&lesson.items[index];
  if(current&&current.category==='verb')t=[current.word,current.present,current.pastSimple,current.pastParticiple].filter(Boolean).join(', ');
  if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){alert('Озвучка не поддерживается этим браузером.');return}
  const play=()=>{
    window.speechSynthesis.cancel();
    const voices=window.speechSynthesis.getVoices();
    activeUtterance=new SpeechSynthesisUtterance(t);
    activeUtterance.lang=current&&current.language==='es'?'es-ES':'en-US';
    activeUtterance.rate=.82;
    activeUtterance.volume=1;
    const voiceLang=current&&current.language==='es'?'es':'en';activeUtterance.voice=voices.find(v=>v.lang&&v.lang.toLowerCase().startsWith(voiceLang))||null;
    activeUtterance.onend=activeUtterance.onerror=()=>{activeUtterance=null};
    window.speechSynthesis.resume();
    window.speechSynthesis.speak(activeUtterance);
  };
  if(window.speechSynthesis.getVoices().length)play();
  else{window.speechSynthesis.onvoiceschanged=()=>{window.speechSynthesis.onvoiceschanged=null;play()};setTimeout(play,350)}
}function revealAnswer(){document.getElementById('answerBlock').classList.remove('hidden');document.getElementById('revealTools').classList.add('hidden')}
function rate(known){if(!known&&document.getElementById('answerBlock').classList.contains('hidden')){revealAnswer();app.querySelectorAll('.answers button').forEach(b=>b.disabled=true);setTimeout(()=>saveRating(false),1500);return}saveRating(known)}
function saveRating(known){ratings.push({key:lesson.items[index].key,known});index++;if(index<lesson.items.length)renderCard();else{quizIndex=0;quizScore=0;quizAnswers=[];retry=[];renderQuiz()}}
function choicesFor(item,reverse){let pool=lesson.items.filter(x=>x.key!==item.key).map(x=>reverse?x.word:x.translation);pool=[...new Set(pool)];pool.sort(()=>Math.random()-.5);const right=reverse?item.word:item.translation;return [right,...pool.slice(0,3)].sort(()=>Math.random()-.5)}
function renderQuiz(){app.dataset.view='quiz';const x=lesson.items[quizIndex],reverse=Math.random()<.5,choices=choicesFor(x,reverse);x._reverse=reverse;app.innerHTML=`<div class="brand">ПРОВЕРКА · ${quizIndex+1}/${lesson.total}</div><section class="panel"><div class="quiz-title">${reverse?'Выбери слово на изучаемом языке':'Выбери перевод'}</div><div class="quiz-prompt">${esc(reverse?x.translation:x.word)}</div>${choices.map(c=>`<button class="btn choice" data-choice="${esc(c)}" onclick="quiz(this)">${esc(c)}</button>`).join('')}</section>`}
function quiz(button){const x=lesson.items[quizIndex],selected=button.dataset.choice,right=x._reverse?x.word:x.translation,correct=selected===right,buttons=[...app.querySelectorAll('.choice')];buttons.forEach(b=>{b.disabled=true;if(b.dataset.choice===right)b.classList.add('correct')});if(!correct)button.classList.add('wrong');if(correct)quizScore++;else retry.push(x);quizAnswers.push({key:x.key,word:x.word,quizCorrect:correct});setTimeout(()=>{quizIndex++;quizIndex<lesson.items.length?renderQuiz():retry.length?startRetry():finishLesson()},850)}
function startRetry(){retryIndex=0;renderRetry()}function renderRetry(){app.dataset.view='retry';const x=retry[retryIndex],choices=choicesFor(x,false);app.innerHTML=`<div class="brand">РАБОТА НАД ОШИБКАМИ · ${retryIndex+1}/${retry.length}</div><section class="panel"><div class="quiz-title">Попробуй ещё раз</div><div class="quiz-prompt">${esc(x.word)}</div>${choices.map(c=>`<button class="btn choice" onclick='answerRetry(${JSON.stringify(c)})'>${esc(c)}</button>`).join('')}</section>`}function answerRetry(v){const x=retry[retryIndex];if(v!==x.translation){app.querySelector('.quiz-title').textContent='Пока нет — попробуй ещё';return}retryIndex++;retryIndex<retry.length?renderRetry():finishLesson()}
async function finishLesson(){app.innerHTML='<div class="loading">Сохраняю результат…</div>';const known=ratings.filter(x=>x.known).length,payload={sessionId:lesson.sessionId,category:lesson.category,answers:quizAnswers,score:quizScore,total:lesson.total,known,unknown:lesson.total-known,recovered:retry.length};try{try{await call('saveLesson',TOKEN,payload)}catch(e){if(!/NetworkError|HTTP 0/i.test(e.message))throw e;await new Promise(r=>setTimeout(r,900));await call('saveLesson',TOKEN,payload)}app.innerHTML=`<div class="brand">ЗАНЯТИЕ ЗАВЕРШЕНО</div><section class="panel score"><span>Результат первой проверки</span><strong>${quizScore}/${lesson.total}</strong><p class="muted">${retry.length?'Ошибки разобраны сразу. Эти слова скоро вернутся на повторение.':'Отлично — следующая проверка будет по расписанию.'}</p><button class="btn primary" onclick="init()">На главную</button></section>`}catch(e){fail(e)}}
function studentLink(t){return APP_URL+'?token='+encodeURIComponent(t)}function fmtDate(v){return v?new Date(v).toLocaleString('ru-RU'):'ещё не заходил'}
function tabOptions(items,emptyLabel){return `<option value="">${emptyLabel}</option>`+items.map(x=>`<option value="${esc(x.name)}" data-language="${esc(x.language)}">${esc(x.name)}</option>`).join('')}
function syncTabLanguage(){const option=newWords.options[newWords.selectedIndex];if(option&&option.dataset.language)newLanguage.value=option.dataset.language}
function renderTeacher(students){app.className='shell admin';app.innerHTML=`<div class="brand">WORDS · КАБИНЕТ УЧИТЕЛЯ</div><section class="panel"><h1 style="font-family:Georgia,serif">Ученики</h1><div>${students.map(studentRow).join('')||'<p>Учеников пока нет.</p>'}</div></section><section class="panel"><h2>Добавить ученика</h2><input id="newName" class="field" placeholder="Имя"><div class="row"><select id="newWords" class="field" onchange="syncTabLanguage()">${tabOptions(tableTabs.words,'Выберите вкладку слов')}</select><select id="newVerbs" class="field">${tabOptions(tableTabs.verbs,'Без вкладки глаголов')}</select></div><select id="newLanguage" class="field"><option value="en">Английский</option><option value="es">Испанский</option></select><button class="btn primary" onclick="addStudent()">Создать персональную ссылку</button></section>`}
async function teacherLogin(){let key=localStorage.getItem('wordsTeacher')||'';if(!key)key=prompt('Введите код преподавателя:')||'';if(!key)return;app.innerHTML='<div class="loading">Открываю кабинет преподавателя…</div>';try{const d=await call('bootstrap','',key);if(d.role!=='teacher')throw new Error('Неверный код.');TEACHER=key;localStorage.setItem('wordsTeacher',key);tableTabs=d.tabs||{words:[],verbs:[]};renderTeacher(d.dashboard)}catch(e){localStorage.removeItem('wordsTeacher');alert(e.message);location.reload()}}
function studentRow(s){const difficult=s.difficult||[],items=s.history||[],words=s.words||{learned:0,studied:s.studied||0},verbs=s.verbs||{learned:0,studied:0},hard=difficult.length?difficult.map(x=>`${esc(x.word)} (${x.wrong})`).join(', '):'ошибок пока нет',history=items.length?items.map(x=>`<div class="history">${fmtDate(x.date)} · ${x.category==='verb'?'глаголы':'слова'} · ${x.score}/${x.total}</div>`).join(''):'<div class="history">Занятий пока нет</div>';return `<div class="student"><div class="student-head"><div><b>${esc(s.name)}</b><div class="meta">Последний вход: ${fmtDate(s.lastSeen)} · последний тест ${s.lastScore||'—'}</div><div class="meta">Вкладки: ${esc(s.wordsTab)} / ${esc(s.verbsTab||'—')}</div></div><div><button class="btn secondary" onclick='copyLink(${JSON.stringify(s.token)})'>Ссылка</button> <button class="btn ghost" onclick='resetStudent(${JSON.stringify(s.token)},${JSON.stringify(s.name)})'>Сбросить прогресс</button> <button class="btn ${s.active?'danger':'primary'}" onclick='toggleStudent(${JSON.stringify(s.token)},${!s.active})'>${s.active?'Отключить':'Включить'}</button> <button class="btn danger" onclick='removeStudent(${JSON.stringify(s.token)},${JSON.stringify(s.name)})'>Удалить</button></div></div><div class="student-grid"><div class="mini"><b>${s.today||0}</b><br>занятий сегодня</div><div class="mini"><b>${s.week||0}</b><br>за 7 дней</div><div class="mini"><b>${words.learned||0}/${words.studied||0}</b><br>слова</div><div class="mini"><b>${verbs.learned||0}/${verbs.studied||0}</b><br>глаголы</div></div><details class="details"><summary>Ошибки и история</summary><p><b>Сложные:</b> ${hard}</p>${history}</details></div>`}
async function addStudent(){try{const r=await call('createStudent',TEACHER,{name:newName.value,wordsTab:newWords.value,verbsTab:newVerbs.value,language:newLanguage.value});renderTeacher(r.dashboard);await copyText(studentLink(r.token));alert('Ученик создан. Ссылка скопирована.')}catch(e){alert(e.message)}}async function toggleStudent(t,a){try{renderTeacher(await call('setStudentActive',TEACHER,t,a))}catch(e){alert(e.message)}}async function resetStudent(t,name){if(!confirm('Удалить весь прогресс и историю ученика «'+name+'»?'))return;try{const dashboard=await call('resetStudentProgress',TEACHER,t);localStorage.removeItem('wordsHome:'+t);renderTeacher(dashboard);alert('Прогресс ученика сброшен: счётчики обнулены.')}catch(e){alert(e.message)}}async function removeStudent(t,name){if(!confirm('Удалить ученика «'+name+'» вместе со всем прогрессом и историей? Вкладки со словами останутся.'))return;try{const dashboard=await call('deleteStudent',TEACHER,t);localStorage.removeItem('wordsHome:'+t);renderTeacher(dashboard);alert('Ученик «'+name+'» удалён.')}catch(e){alert(e.message)}}async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){prompt('Скопируйте ссылку:',t)}}async function copyLink(t){await copyText(studentLink(t));alert('Персональная ссылка готова.')}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));init();
</script></body></html>
