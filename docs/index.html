async function teacherLogin(){let key=localStorage.getItem('wordsTeacher')||'';if(!key)key=prompt('Введите код преподавателя:')||'';if(!key)return;showLoading('Открываю кабинет преподавателя…');try{const d=await call('bootstrap','',key);if(d.role!=='teacher')throw new Error('Неверный код.');TEACHER=key;localStorage.setItem('wordsTeacher',key);tableTabs=d.tabs||{words:[],verbs:[]};renderTeacher(d.dashboard)}catch(e){localStorage.removeItem('wordsTeacher');alert(e.message);location.reload()}}
function studentRow(s){const difficult=s.difficult||[],items=s.history||[],words=s.words||{learned:0,studied:s.studied||0},verbs=s.verbs||{learned:0,studied:0},hard=difficult.length?difficult.map(x=>`${esc(x.word)} (${x.wrong})`).join(', '):'ошибок пока нет',history=items.length?items.map(x=>`<div class="history">${fmtDate(x.date)} · ${x.category==='verb'?'глаголы':'слова'} · ${x.score}/${x.total}</div>`).join(''):'<div class="history">Занятий пока нет</div>',editData=encodeURIComponent(JSON.stringify({token:s.token,name:s.name,wordsTab:s.wordsTab,verbsTab:s.verbsTab,language:s.language}));return `<div class="student"><div class="student-head"><div><b>${esc(s.name)}</b><div class="meta">Последний вход: ${fmtDate(s.lastSeen)} · последний тест ${s.lastScore||'—'}</div><div class="meta">Вкладки: ${esc(s.wordsTab)} / ${esc(s.verbsTab||'—')}</div></div><div><button class="btn secondary" onclick='copyLink(${JSON.stringify(s.token)})'>Ссылка</button> <button class="btn secondary" onclick="editStudent('${editData}')">Редактировать</button> <button class="btn ghost" onclick='resetStudent(${JSON.stringify(s.token)},${JSON.stringify(s.name)})'>Сбросить прогресс</button> <button class="btn ${s.active?'danger':'primary'}" onclick='toggleStudent(${JSON.stringify(s.token)},${!s.active})'>${s.active?'Отключить':'Включить'}</button> <button class="btn danger" onclick='removeStudent(${JSON.stringify(s.token)},${JSON.stringify(s.name)})'>Удалить</button></div></div><div class="student-grid"><div class="mini"><b>${s.today||0}</b><br>занятий сегодня</div><div class="mini"><b>${s.week||0}</b><br>за 7 дней</div><div class="mini"><b>${words.learned||0}/${words.studied||0}</b><br>слова</div><div class="mini"><b>${verbs.learned||0}/${verbs.studied||0}</b><br>глаголы</div></div><details class="details"><summary>Ошибки и история</summary><p><b>Сложные:</b> ${hard}</p>${history}</details></div>`}
async function addStudent(){try{const r=await call('createStudent',TEACHER,{name:newName.value,wordsTab:newWords.value,verbsTab:newVerbs.value,language:newLanguage.value});renderTeacher(r.dashboard);await copyText(studentLink(r.token));alert('Ученик создан. Ссылка скопирована.')}catch(e){alert(e.message)}}async function editStudent(encoded){const s=JSON.parse(decodeURIComponent(encoded)),name=prompt('Имя ученика:',s.name);if(name===null)return;const wordsTab=prompt('Вкладка слов:',s.wordsTab);if(wordsTab===null)return;const verbsTab=prompt('Вкладка глаголов (можно оставить пустой):',s.verbsTab||'');if(verbsTab===null)return;const language=confirm('Нажмите OK для испанского, «Отмена» для английского.')?'es':'en';try{renderTeacher(await call('updateStudent',TEACHER,s.token,{name,wordsTab,verbsTab,language}))}catch(e){alert(e.message)}}async function toggleStudent(t,a){try{renderTeacher(await call('setStudentActive',TEACHER,t,a))}catch(e){alert(e.message)}}async function resetStudent(t,name){if(!confirm('Удалить весь прогресс и историю ученика «'+name+'»?'))return;try{const dashboard=await call('resetStudentProgress',TEACHER,t);localStorage.removeItem('wordsHome:'+t);renderTeacher(dashboard);alert('Прогресс ученика сброшен: счётчики обнулены.')}catch(e){alert(e.message)}}async function removeStudent(t,name){if(!confirm('Удалить ученика «'+name+'» вместе со всем прогрессом и историей? Вкладки со словами останутся.'))return;try{const dashboard=await call('deleteStudent',TEACHER,t);localStorage.removeItem('wordsHome:'+t);renderTeacher(dashboard);alert('Ученик «'+name+'» удалён.')}catch(e){alert(e.message)}}async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){prompt('Скопируйте ссылку:',t)}}async function copyLink(t){await copyText(studentLink(t));alert('Персональная ссылка готова.')}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=33',{updateViaCache:'none'}).then(registration=>registration.update()).catch(()=>{}))}init();
</script></body></html>
