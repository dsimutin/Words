function saveHomeworkSession(nextIndex){try{localStorage.setItem(homeworkSessionKey(),JSON.stringify({homework:homework,nextIndex:Number(nextIndex||0),score:homeworkScore,results:homeworkResults,savedAt:Date.now()}))}catch(e){}}
function loadHomeworkSession(){try{const saved=JSON.parse(localStorage.getItem(homeworkSessionKey())||'null');if(!saved||!saved.homework||!Array.isArray(saved.homework.items)||Date.now()-Number(saved.savedAt||0)>7*86400000){localStorage.removeItem(homeworkSessionKey());return null}return saved}catch(e){localStorage.removeItem(homeworkSessionKey());return null}}
async function startHomework(){const saved=loadHomeworkSession();if(saved){homework=saved.homework;homeworkIndex=Math.max(0,Number(saved.nextIndex||0));homeworkScore=Number(saved.score||0);homeworkResults=Array.isArray(saved.results)?saved.results:[];homeworkHintLevel=0;if(homeworkIndex>=homework.items.length){completeHomework();return}renderHomework();return}showLoading('Подбираю семь предложений…');const cacheKey='wordsHomework:'+TOKEN;try{homework=await readCall('loadHomework',TOKEN);try{localStorage.setItem(cacheKey,JSON.stringify(homework))}catch(ignore){}}catch(e){try{homework=JSON.parse(localStorage.getItem(cacheKey)||'null');if(!homework)throw e;alert('Сервер временно недоступен. Открываю последний сохранённый набор.')}catch(ignore){fail(e);return}}homework.sessionId='homework-'+(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());homeworkIndex=0;homeworkScore=0;homeworkResults=[];homeworkHintLevel=0;if(!homework.available||!homework.items.length){app.dataset.view='homework';app.innerHTML=`<div class="brand">ДОМАШНЯЯ РАБОТА</div><section class="panel score"><h2>Заданий пока нет</h2><p class="muted">Преподаватель ещё не назначил предложения.</p><button class="btn secondary" onclick="init()">На главную</button></section>`;return}saveHomeworkSession(0);renderHomework()}
function shuffledHomeworkHints(words){const list=(words||[]).slice();for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}return list}
function renderHomework(){app.dataset.view='homework';app.className='shell';const item=homework.items[homeworkIndex],draftKey='wordsHomeworkDraft:'+TOKEN+':'+item.id,draft=localStorage.getItem(draftKey)||'',progress=Math.round(homeworkIndex/homework.items.length*100);homeworkHintLevel=0;app.innerHTML=`<div class="brand">ДОМАШНЯЯ РАБОТА · ${homeworkIndex+1}/${homework.items.length}</div><section class="panel homework-card"><div class="eyebrow">ПЕРЕВЕДИТЕ НА АНГЛИЙСКИЙ</div><div class="homework-progress"><i style="width:${progress}%"></i></div><div class="tense-guide" aria-label="Путь перевода"><div class="tense-guide-steps"><span>Когда?</span><i>→</i><span>Факт / процесс?</span><i>→</i><span>Время</span><i>→</i><span>Формула</span><i>→</i><strong>Перевод</strong></div></div><div class="homework-prompt">${esc(item.prompt)}</div><textarea id="homeworkInput" class="homework-input" enterkeyhint="done" autocapitalize="sentences" autocomplete="off" spellcheck="true" placeholder="Напишите перевод с клавиатуры…" oninput="saveHomeworkDraft()">${esc(draft)}</textarea><div id="homeworkHints"></div><div id="homeworkFeedback"></div><div class="spacer"></div><div class="homework-actions"><button id="hintButton" class="btn secondary" onclick="showHomeworkHint()">💡 Нужна подсказка</button><button id="checkHomeworkButton" class="btn primary" onclick="submitHomeworkAnswer()">Проверить</button><button class="btn ghost" onclick="init()">Сохранить и выйти</button></div></section>`;setTimeout(()=>{const input=document.getElementById('homeworkInput');if(input)input.focus({preventScroll:true})},120)}
function saveHomeworkDraft(){const item=homework&&homework.items[homeworkIndex],input=document.getElementById('homeworkInput');if(item&&input)localStorage.setItem('wordsHomeworkDraft:'+TOKEN+':'+item.id,input.value)}
function insertHomeworkHint(word){const input=document.getElementById('homeworkInput');if(!input)return;const before=input.value.trimEnd();input.value=before+(before?' ':'')+word;input.focus();input.setSelectionRange(input.value.length,input.value.length);saveHomeworkDraft()}
function showHomeworkHint(){const item=homework.items[homeworkIndex],box=document.getElementById('homeworkHints');homeworkHintLevel=Math.min(2,homeworkHintLevel+1);const all=shuffledHomeworkHints(item.hints),shown=homeworkHintLevel===1?all.slice(0,Math.min(3,all.length)):all;box.innerHTML=`<div class="hint-box"><b>${homeworkHintLevel===1?'Несколько ключевых слов':'Все необходимые слова'}</b><div class="hint-words">${shown.map(word=>`<button class="hint-word" onclick='insertHomeworkHint(${JSON.stringify(word)})'>${esc(word)}</button>`).join('')}</div></div>`;const button=document.getElementById('hintButton');if(button)button.textContent=homeworkHintLevel===1?'Показать все слова':'Подсказки открыты';if(homeworkHintLevel>=2&&button)button.disabled=true}
async function submitHomeworkAnswer(){const item=homework.items[homeworkIndex],input=document.getElementById('homeworkInput'),answer=input.value.trim();if(!answer){input.focus();input.setAttribute('placeholder','Сначала напишите перевод…');return}const button=document.getElementById('checkHomeworkButton');button.disabled=true;button.textContent='Проверяю…';try{const result=await call('checkHomeworkAnswer',TOKEN,item.id,answer,homeworkHintLevel);if(result.result==='correct')homeworkScore++;homeworkResults.push({prompt:item.prompt,result:result.result,correctAnswer:result.correctAnswer});saveHomeworkSession(homeworkIndex+1);localStorage.removeItem('wordsHomeworkDraft:'+TOKEN+':'+item.id);input.disabled=true;document.getElementById('hintButton').disabled=true;const reference=result.showTeacherVariant?`<span>${result.result==='correct'?'Вариант учителя:':'Правильный вариант:'}</span><div class="homework-answer">${esc(result.correctAnswer)}</div>`:'';document.getElementById('homeworkFeedback').innerHTML=`<div class="homework-feedback ${result.result}"><b>${esc(result.message)}</b>${reference}</div>`;button.disabled=false;button.textContent=homeworkIndex+1<homework.items.length?'Следующее предложение':'Завершить';button.onclick=nextHomework}catch(e){button.disabled=false;button.textContent='Проверить';alert(e.message)}}
function nextHomework(){homeworkIndex++;homeworkIndex<homework.items.length?renderHomework():completeHomework()}
async function completeHomework(){showLoading('Сохраняю завершённый урок…');try{await call('finishHomeworkSession',TOKEN,homeworkScore,homework.items.length,homework.sessionId||('homework-'+Date.now()),LOCAL_TIME_ZONE);localStorage.removeItem('wordsHome:'+TOKEN);localStorage.removeItem(homeworkSessionKey());renderHomeworkResult()}catch(e){alert('Не удалось отметить урок завершённым. Нажмите «Завершить» ещё раз.');renderHomeworkResult(true)}}
function renderHomeworkResult(saveFailed){app.dataset.view='result';const almost=homeworkResults.filter(x=>x.result==='almost').length,review=homeworkResults.filter(x=>x.result!=='correct').map(x=>`<div class="result-word"><b>${esc(x.prompt)}</b><span>${esc(x.correctAnswer)}</span></div>`).join('');app.innerHTML=`<div class="brand">ДОМАШНЯЯ РАБОТА ЗАВЕРШЕНА</div><section class="panel lesson-result"><div class="result-score-label">Результат самостоятельного перевода</div><strong class="result-score">${homeworkScore}/${homework.items.length}</strong>${saveFailed?'<div class="result-near"><b>Завершение ещё не сохранено</b><br>Повторите отправку, когда появится интернет.</div>':''}${almost?`<div class="result-near"><b>Почти верно: ${almost}</b><br>Эти предложения вернутся на повторение.</div>`:''}${review?`<div class="result-review"><span class="result-review-title">Нужно повторить</span>${review}</div>`:'<div class="result-empty">Все предложения переведены верно!</div>'}<div class="result-actions">${saveFailed?'<button class="btn primary wide" onclick="completeHomework()">Сохранить завершение</button>':`<button class="btn primary wide" onclick="init()">На главную</button>`}</div></section>`}
function teacherHomeworkBlock(student){const h=student.homework||{};if(!h.available)return`<div class="teacher-homework"><b>Домашняя работа</b><div class="meta">Вкладка «${esc(h.sheetName||student.homeworkTab||'—')}» не найдена.</div></div>`;const checked=Number(h.correct||0)+Number(h.almost||0)+Number(h.wrong||0),problems=(h.problems||[]).map(x=>`<div class="homework-problem ${/Почти/.test(x.status)?'almost':'wrong'}"><b>${esc(x.status||'Нужно проверить')} · ${esc(x.prompt)}</b><span>Ответ: ${esc(x.answer||'—')}</span><span>Правильно: ${esc(x.correct||'—')}</span>${x.hint?`<span>Подсказка: ${esc(x.hint)} · попыток: ${Number(x.attempts||0)}</span>`:''}</div>`).join('');return`<div class="teacher-homework"><div class="teacher-homework-head"><div><b>Домашняя работа</b><div class="meta">${esc(h.sheetName||student.homeworkTab||'')} · ${h.lastAt?'последний ответ '+fmtDate(h.lastAt):'ещё не выполнялась'} · пройдено ${Number(h.attempted||0)}/${Number(h.total||0)}</div></div><div class="teacher-homework-score">${Number(h.correct||0)}/${checked||7}</div></div><div class="teacher-homework-stats"><div class="teacher-homework-stat"><b>${Number(h.correct||0)}</b>верно</div><div class="teacher-homework-stat"><b>${Number(h.almost||0)}</b>почти</div><div class="teacher-homework-stat"><b>${Number(h.wrong||0)}</b>ошибки</div><div class="teacher-homework-stat"><b>${Number(h.hints||0)}</b>подсказки</div></div>${problems?`<details class="details"><summary>Показать проблемные ответы</summary>${problems}</details>`:'<div class="meta" style="margin-top:9px">Проблемных ответов нет.</div>'}</div>`}
function configuredTabOptions(items,value,emptyLabel){return`<option value="">${emptyLabel}</option>`+(items||[]).map(x=>`<option value="${esc(x.name)}" ${x.name===value?'selected':''}>${esc(x.name)}</option>`).join('')}
function closeStudentSettings(){document.getElementById('studentSettingsModal')?.remove()}
editStudent=async function(encoded){const s=JSON.parse(decodeURIComponent(encoded));document.body.insertAdjacentHTML('beforeend',`<div id="studentSettingsModal" class="modal-backdrop"><section class="modal-card"><h2>Настройки ученика</h2><label>Имя<input id="editName" class="field" value="${esc(s.name)}"></label><label>Вкладка слов<select id="editWords" class="field">${configuredTabOptions(tableTabs.words,s.wordsTab,'Выберите вкладку слов')}</select></label><label>Вкладка глаголов<select id="editVerbs" class="field">${configuredTabOptions(tableTabs.verbs,s.verbsTab,'Без вкладки глаголов')}</select></label><label>Вкладка предложений<select id="editHomework" class="field">${configuredTabOptions(tableTabs.homework,s.homeworkTab,'Без вкладки предложений')}</select></label><label>Язык<select id="editLanguage" class="field"><option value="en" ${s.language!=='es'?'selected':''}>Английский</option><option value="es" ${s.language==='es'?'selected':''}>Испанский</option></select></label><div class="modal-actions"><button class="btn ghost" onclick="closeStudentSettings()">Отмена</button><button class="btn primary" onclick='saveStudentSettings(${JSON.stringify(s.token)})'>Сохранить</button></div></section></div>`)}
async function saveStudentSettings(token){const value=id=>document.getElementById(id).value,data={name:value('editName'),wordsTab:value('editWords'),verbsTab:value('editVerbs'),homeworkTab:value('editHomework'),language:value('editLanguage')};try{closeStudentSettings();showLoading('Сохраняю настройки…');renderTeacher(await call('updateStudent',TEACHER,token,data))}catch(e){alert(e.message);location.reload()}}
addStudent=async function(){try{const r=await call('createStudent',TEACHER,{name:newName.value,wordsTab:newWords.value,verbsTab:newVerbs.value,homeworkTab:newHomework.value,language:newLanguage.value});renderTeacher(r.dashboard);await copyText(studentLink(r.token));alert('Ученик создан. Ссылка скопирована.')}catch(e){alert(e.message)}}
const studentRowWithoutHomework=studentRow;studentRow=function(student){const oldData=encodeURIComponent(JSON.stringify({token:student.token,name:student.name,wordsTab:student.wordsTab,verbsTab:student.verbsTab,language:student.language})),newData=encodeURIComponent(JSON.stringify({token:student.token,name:student.name,wordsTab:student.wordsTab,verbsTab:student.verbsTab,homeworkTab:student.homeworkTab||'',language:student.language}));return studentRowWithoutHomework(student).replace(oldData,newData).replace('<div class="student-actions">',teacherHomeworkBlock(student)+'<div class="student-actions">')};
init();
</script></body></html>
